# Project-wide Gradle settings. Values mirror the TV app's, because both build the same core.
#
# 4 GB heap: R8 minification of the release build needs well more than the old 2 GB default.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM and inherits org.gradle.jvmargs when this is unset.
kotlin.daemon.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
# Bounds peak compiler memory when several variants compile at once (this app has four:
# standard/x86_64 x debug/release).
org.gradle.workers.max=4
# A crashed Kotlin daemon must fail the build, not silently retry the compilation inside the Gradle
# daemon — that fallback turns one out-of-memory daemon into a cascade of failed tasks.
kotlin.daemon.useFallbackStrategy=false
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official

# EVERY string this app shows lives in :core's resources, so the app's R class must carry core's
# resource ids. With the AGP default (true) each R.string.* would have to be qualified with core's
# own R, and the app would not compile against the strings it is built to display.
android.nonTransitiveRClass=false

# Python collection sources (TVbox type 3 with an api ending in .py).
# true (default): full build with the Chaquopy/CPython runtime, .py spiders can run.
# false: slim build without the runtime; .py sites are greyed out as unsupported.
# Override on the command line with -PWITH_PY=false.
WITH_PY=true
# Emulator-only switch: adds x86_64 to the Python runtime's ABI list. Chaquopy reads the ABI
# filters from defaultConfig only, so the x86_64 product flavor alone is not enough.
# Use `-PPY_X86_64=true :app:assembleX86_64Debug` for emulator debugging; leave false otherwise.
PY_X86_64=false
